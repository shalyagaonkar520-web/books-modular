name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check backend tests
      - name: Ruff format check
        run: ruff format --check backend tests
        continue-on-error: true

  backend-tests-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run pytest
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-for-tests-only
        run: pytest -q --cov=backend --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  backend-tests-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roomanbooks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Verify migrations apply cleanly
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-for-tests-only
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/roomanbooks_test
        run: |
          alembic -c database/alembic.ini upgrade head
          alembic -c database/alembic.ini check
      - name: Run pytest against PostgreSQL
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-for-tests-only
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/roomanbooks_test
        run: pytest -q

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/Dockerfile
          push: false
          load: true
          tags: roomanbooks-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: roomanbooks-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the API image
        run: |
          docker run -d --name api-smoke -e SECRET_KEY=ci-smoke-secret -e ENVIRONMENT=development -p 8000:8000 roomanbooks-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"healthy"' /tmp/health.json
          docker rm -f api-smoke

  integration:
    name: End-to-end smoke (API + built frontend)
    runs-on: ubuntu-latest
    needs: [backend-tests-sqlite, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Start API and exercise a real workflow
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-integration-secret
          DATABASE_URL: sqlite:///./database/data/ci.db
        run: |
          uvicorn backend.main:app --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 2; done
          bash scripts/smoke_api.sh http://localhost:8000
