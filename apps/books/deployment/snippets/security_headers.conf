# Shared security headers, included by the server block and by every location
# that sets its own add_header (nginx replaces, rather than merges, inherited
# add_header directives once a location adds one of its own). Keep this list in
# sync across all include sites.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Clickjacking + injection defence for the SPA shell. Styles are inlined by the
# Vite/React build so 'unsafe-inline' is required for style-src; scripts are not.
# data:/blob: cover inline images, generated previews and blob downloads.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
