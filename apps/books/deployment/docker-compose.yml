services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roomanbooks}
      POSTGRES_USER: ${POSTGRES_USER:-roomanbooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-roomanbooks} -d ${POSTGRES_DB:-roomanbooks}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # Resolved relative to this file's own location - one level up is the
      # repo root, which the Dockerfile needs as its build context (it COPYs
      # backend/ and database/ by their repo-root-relative paths).
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-roomanbooks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-roomanbooks}
      DATA_DIR: /app/data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-true}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Outbound email: read from .env on the host, never baked
      # into the image.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Rooman Books Accounts}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # The web container's nginx is the only client; believe its X-Forwarded-For.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      REQUIRE_ORG_APPROVAL: ${REQUIRE_ORG_APPROVAL:-false}
      # Connected apps (docs/INTEGRATIONS.md)
      INTEGRATION_RATE_LIMIT_PER_MINUTE: ${INTEGRATION_RATE_LIMIT_PER_MINUTE:-300}
      WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-true}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
    volumes:
      - api_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      # The web container reaches the API over the compose network. Publish it
      # on the host's loopback only by default, so the public path is always
      # through nginx (rate limits, headers). API_BIND=0.0.0.0 restores the old behaviour.
      - '${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000'

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:80'

volumes:
  postgres_data:
  api_data:
