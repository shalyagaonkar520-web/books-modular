# Runs next to Rooman Billing (CT111). Settings live in /etc/rooman/billing-connector.env (root-only):
#   BILLING_DATABASE_URL=postgresql+psycopg://books_reader:<password>@db:5432/<billing db>
#   BOOKS_EVENTS_URL=https://books.futureacad.ae/api/internal/events
#   EVENT_SIGNING_SECRET=<same as Books>
#   ORG_MAP=<billing org id>=<books org id>
#   SYNC_FROM=2026-10-16            (optional: only invoices/payments from this day; customers and plans always go)
services:
  connector:
    image: rooman-billing-connector:latest
    restart: unless-stopped
    env_file: /etc/rooman/billing-connector.env
    volumes:
      - state:/data
    networks:
      - billing

volumes:
  state:

networks:
  billing:
    external: true
    name: ${BILLING_NETWORK:-rooman-billing_default}
