# Rooman One: local development stack.
#
#   cp infra/compose/.env.example infra/compose/.env   # then fill in the secrets
#   docker compose -f infra/compose/docker-compose.yml up -d --build
#
#   http://books.localhost      Rooman Books (unchanged image and behaviour)
#   http://id.localhost         Core (sign-in placeholder + /api/health)
#   http://bookings.localhost   Bookings API (/api/health)
#
# Only Traefik publishes a port, and only on 127.0.0.1 by default. Databases
# and NATS sit on the internal "private" network, which has no route out.
# APIs that must call out (SMTP, Razorpay) also join "egress", which
# publishes nothing.
#
# This file is for local development only. Production Books still deploys
# from apps/books/deployment (see docs/runbooks/deploy.md).

name: rooman-one

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [private]
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
    interval: 5s
    timeout: 5s
    retries: 10

services:
  gateway:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=rooman-one_edge
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
      - --ping=true
    ports:
      - '${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-80}:80'
      # Dashboard, local only.
      - '127.0.0.1:${GATEWAY_DASHBOARD_PORT:-8088}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]
    labels:
      - traefik.enable=true
      # Shared middlewares, attached to every router below.
      - traefik.http.middlewares.secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.secure-headers.headers.referrerPolicy=same-origin
      - traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.rate-limit.ratelimit.average=100
      - traefik.http.middlewares.rate-limit.ratelimit.burst=50
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ Books
  books-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${BOOKS_DB_NAME:-roomanbooks}
      POSTGRES_USER: ${BOOKS_DB_USER:-roomanbooks}
      POSTGRES_PASSWORD: ${BOOKS_DB_PASSWORD:?set BOOKS_DB_PASSWORD in infra/compose/.env}
    volumes:
      - books_db:/var/lib/postgresql/data

  books-api:
    build:
      context: ../../apps/books
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${BOOKS_ENVIRONMENT:-development}
      SECRET_KEY: ${BOOKS_SECRET_KEY:?set BOOKS_SECRET_KEY in infra/compose/.env}
      DATABASE_URL: postgresql+psycopg://${BOOKS_DB_USER:-roomanbooks}:${BOOKS_DB_PASSWORD}@books-db:5432/${BOOKS_DB_NAME:-roomanbooks}
      DATA_DIR: /app/data
      CORS_ORIGINS: http://books.localhost
      COOKIE_SECURE: 'false'
      ALLOW_PUBLIC_SIGNUP: 'true'
      WEB_CONCURRENCY: '2'
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Rooman Books Accounts}
    volumes:
      - books_data:/app/data
    depends_on:
      books-db:
        condition: service_healthy
    networks:
      private:
        # The Books web image proxies /api to "api:8000"; keep that name.
        aliases: [api]
      egress: {}

  books-web:
    build:
      context: ../../apps/books
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [books-api]
    networks: [edge, private]
    labels:
      - traefik.enable=true
      - traefik.http.routers.books.rule=Host(`books.${DOMAIN:-localhost}`)
      - traefik.http.routers.books.entrypoints=web
      - traefik.http.routers.books.middlewares=secure-headers@docker,rate-limit@docker
      - traefik.http.services.books.loadbalancer.server.port=80

  # ------------------------------------------------------------------- Core
  core-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${CORE_DB_NAME:-rooman_core}
      POSTGRES_USER: ${CORE_DB_USER:-rooman_core}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in infra/compose/.env}
    volumes:
      - core_db:/var/lib/postgresql/data

  core-api:
    build:
      context: ../..
      dockerfile: core/backend/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      RUN_MIGRATIONS: 'true'
      DATABASE_URL: postgresql+psycopg://${CORE_DB_USER:-rooman_core}:${CORE_DB_PASSWORD}@core-db:5432/${CORE_DB_NAME:-rooman_core}
      PUBLIC_URL: http://id.${DOMAIN:-localhost}
      CORS_ORIGINS: http://id.${DOMAIN:-localhost}
    depends_on:
      core-db:
        condition: service_healthy
    networks: [private, egress]

  core-web:
    build:
      context: ../..
      dockerfile: core/frontend/Dockerfile
    restart: unless-stopped
    depends_on: [core-api]
    networks: [edge, private]
    labels:
      - traefik.enable=true
      - traefik.http.routers.core.rule=Host(`id.${DOMAIN:-localhost}`)
      - traefik.http.routers.core.entrypoints=web
      - traefik.http.routers.core.middlewares=secure-headers@docker,rate-limit@docker
      - traefik.http.services.core.loadbalancer.server.port=80

  # --------------------------------------------------------------- Bookings
  bookings-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${BOOKINGS_DB_NAME:-rooman_bookings}
      POSTGRES_USER: ${BOOKINGS_DB_USER:-rooman_bookings}
      POSTGRES_PASSWORD: ${BOOKINGS_DB_PASSWORD:?set BOOKINGS_DB_PASSWORD in infra/compose/.env}
    volumes:
      - bookings_db:/var/lib/postgresql/data

  bookings-api:
    build:
      context: ../../apps/bookings/backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      RUN_MIGRATIONS: 'true'
      DATABASE_URL: postgresql+psycopg://${BOOKINGS_DB_USER:-rooman_bookings}:${BOOKINGS_DB_PASSWORD}@bookings-db:5432/${BOOKINGS_DB_NAME:-rooman_bookings}
      PUBLIC_URL: http://bookings.${DOMAIN:-localhost}
    depends_on:
      bookings-db:
        condition: service_healthy
    networks: [edge, private, egress]
    labels:
      - traefik.enable=true
      - traefik.http.routers.bookings.rule=Host(`bookings.${DOMAIN:-localhost}`)
      - traefik.http.routers.bookings.entrypoints=web
      - traefik.http.routers.bookings.middlewares=secure-headers@docker,rate-limit@docker
      - traefik.http.services.bookings.loadbalancer.server.port=8000

  # -------------------------------------------------------------- Event hub
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
      - --user=${NATS_USER:-rooman}
      - --pass=${NATS_PASSWORD:?set NATS_PASSWORD in infra/compose/.env}
    volumes:
      - nats_data:/data
    networks: [private]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8222/healthz?js-enabled-only=true']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge:
    name: rooman-one_edge
  private:
    internal: true
  egress: {}

volumes:
  books_db:
  books_data:
  core_db:
  bookings_db:
  nats_data:
